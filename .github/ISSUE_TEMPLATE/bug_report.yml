name: 🐛 Bug Report
description: Create a report to help us improve the Arabic NLP & Grammar Suite
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        شكراً لإبلاغنا عن المشكلة! يُرجى تقديم أكبر قدر ممكن من التفاصيل لمساعدتنا في إصلاحها بسرعة.
        Thank you for reporting an issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description / وصف المشكلة
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem here... / اشرح المشكلة وسياق حدوثها...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / خطوات إعادة إنتاج الخطأ
      description: How can we reproduce this behavior?
      placeholder: |
        1. Paste text '...'
        2. Click on '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: sample-text
    attributes:
      label: Sample Arabic Text / النص العربي المستخدم
      description: The Arabic text that triggered the issue (if applicable).
      placeholder: مثال النص العربي...

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / السلوك المتوقع
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Browser / المتصفح المستخدم
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Mobile Browser (iOS / Android)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist / التحقق المسبق
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
