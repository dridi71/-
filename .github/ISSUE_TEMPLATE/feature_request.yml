name: 💡 Feature Request / اقتراح ميزة جديدة
description: Suggest an idea or enhancement for Arabic NLP & Grammar Suite
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        نرحب بجميع الأفكار والاقتراحات لتطوير المنصة وتوسيع إمكانيات التحليل النحوي والبلاغي والمعجمي!
        We welcome any suggestions or ideas to enhance the platform!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? / هل يرتبط الاقتراح بمشكلة أو نقص؟
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when... / أشعر بالحاجة إلى...

  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution / الحل أو الميزة المقترحة
      description: A clear and concise description of what you want to happen.
      placeholder: Add feature to... / إضافة إمكانية كذا...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / حلول بديلة فكرت بها
      description: Any alternative solutions or features you've considered.

  - type: dropdown
    id: category
    attributes:
      label: Category / مجال الميزة
      options:
        - النحو والإعراب (Grammar & Syntax)
        - البلاغة والبيان (Rhetoric & Figures of Speech)
        - المعاجم والاشتقاق (Lexicons & Morphology)
        - النطق الصوتي (Text-to-Speech)
        - التصدير والتقارير (Export & Reports)
        - واجهة المستخدم والتصميم (UI / UX)
        - Other
    validations:
      required: true
